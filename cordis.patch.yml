# ============================================================================
# dsh-code-ctx 的 bundle patch —— 把代码库上下文引擎挂进 DSH 配置树
# ============================================================================
#
# 【这是什么】
#   DSH 启动时按 bundle 层栈把各插件的 patch 叠起来组成配置树，本文件是 code-ctx 这一层。
#
# 【工作原理】
#   - insert：往配置树里添加新的插件行（entry）
#   - 每个 entry 有 id（行标识，patch 覆盖时按它定位）和 name（插件模块名）
#   - id 必须全局唯一：用包名，不要用裸名（裸名会和其它插件的行标识冲突）
#   - 「id: 值」这一行不能写行尾注释，否则解析器抓不到 entry ID
#   - name 解析到包入口（package.json 的 main → src/plugin.js）
#
# ============================================================================

- insert:
    - id: dsh-code-ctx
      name: 'dsh-code-ctx'
